<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSP 只能写在 meta 里：虚拟主机映射过的请求不进 WebResourceRequested，
     加不了响应头。框架策略给右侧预览页（同站 preview.html），连接策略给
     fetch 内置皮肤，脚本策略同时覆盖 module 入口与它导入的读写模块。
     dev-server.mjs 会对名为 shell.html 的文件做一次 CSP 文本替换，注释里
     不要出现那些策略名，否则它的正则会越过注释结束符，把整篇吞成注释。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'">
<title>皮肤编辑器</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="editor.js"></script>
</body>
</html>
