name: build

# 提交自动编译：推送到 main、PR、以及手动触发都会跑一遍完整构建，
# 产物是两个 zip（插件本体 / 皮肤工具），可在 Actions 页面下载。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - id: build
        uses: ./.github/actions/compile

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: DopusMdViewer-${{ steps.build.outputs.version }}
          path: |
            ${{ steps.build.outputs.plugin_zip }}
            ${{ steps.build.outputs.skinedit_zip }}
          if-no-files-found: error
