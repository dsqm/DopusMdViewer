<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSP 只能写在这里：虚拟主机映射出来的响应由 WebView2 自己合成，加不了响应头，
     而映射过的请求也不会走到 WebResourceRequested。唯一因此拿不到的是
     frame-ancestors，但预览器本身就是顶层文档，用不上那条。
     块正文走一个没有被映射的主机名 mdblocks.localhost。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: https://mddoc.localhost https://mdblocks.localhost data:; font-src 'self' data:; connect-src https://mdblocks.localhost; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>DopusMdViewer</title>

<!-- 三层样式，顺序即层叠顺序：base（本文件）→ skin（C++ 注入）→ fx（字体，永远最后） -->
<link rel="stylesheet" id="base" href="base.css">
<link rel="stylesheet" href="katex.css">
<style id="skin"></style>
<style id="fx"></style>
</head>

<body class="mdv-root">
<div id="doc"></div>
<div id="sb" hidden><div id="sb-thumb"></div></div>

<div id="tools" class="ui mdv-ui" hidden>
  <button type="button" data-act="find">搜索</button>
  <button type="button" data-act="outline">大纲</button>
</div>

<div id="find" class="ui mdv-ui" hidden>
  <input id="find-input" type="search" autocomplete="off" spellcheck="false" placeholder="搜索本文档">
  <span id="find-count"></span>
  <button id="find-case" type="button" class="tog" title="区分大小写">Aa</button>
  <button id="find-prev" type="button" title="上一个 (Shift+Enter)">↑</button>
  <button id="find-next" type="button" title="下一个 (Enter)">↓</button>
  <button id="find-close" type="button" title="关闭 (Esc)">×</button>
</div>

<aside id="outline" class="ui mdv-ui" hidden>
  <div class="outline-head">
    <span>大纲</span>
    <button id="outline-close" type="button" title="关闭 (Esc)">×</button>
  </div>
  <div id="outline-list" class="outline-list"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
