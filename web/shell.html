<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSP 只能写在这里：虚拟主机映射出来的响应由 WebView2 自己合成，加不了响应头，
     而映射过的请求也不会走到 WebResourceRequested。唯一因此拿不到的是
     frame-ancestors，但预览器本身就是顶层文档，用不上那条。
     块正文走一个没有被映射的主机名 mdblocks.local。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://mddoc.local https://mdblocks.local data:; font-src 'self' data:; connect-src https://mdblocks.local; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>DopusMdViewer</title>

<!-- 三层样式，顺序即层叠顺序：base（本文件）→ skin（C++ 注入）→ fx（字体，永远最后） -->
<link rel="stylesheet" id="base" href="base.css">
<link rel="stylesheet" href="katex.css">
<style id="skin"></style>
<style id="fx"></style>
</head>

<body class="mdv-root">
<div id="doc"></div>
<div id="sb" hidden><div id="sb-thumb"></div></div>
<script src="app.js"></script>
</body>
</html>
